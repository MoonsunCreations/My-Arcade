<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moonsun Games — Play Free Online</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Rubik', sans-serif;
      background: #f0f0f0;
      color: #333;
    }
    header {
      background: #20232a;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 2rem;
      color: #61dafb;
    }
    .search-bar input {
      padding: 0.5rem;
      border-radius: 5px;
      border: none;
      width: 200px;
    }
    nav {
      background: #282c34;
      padding: 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }
    nav a {
      color: #61dafb;
      text-decoration: none;
      font-weight: bold;
    }
    nav a:hover {
      color: #fff;
    }
    .container {
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.5rem;
    }
    .game-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
      cursor: pointer;
      text-align: center;
    }
    .game-card:hover {
      transform: scale(1.05);
    }
    .game-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
    }
    .game-card h3 {
      padding: 0.5rem;
      font-size: 1rem;
    }
    footer {
      background: #20232a;
      color: white;
      text-align: center;
      padding: 2rem 0;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Moonsun Games</h1>
    <div class="search-bar">
      <input type="text" placeholder="Search games..." id="searchInput" />
    </div>
  </header>

  <nav>
    <a href="#">Action</a>
    <a href="#">Puzzle</a>
    <a href="#">Racing</a>
    <a href="#">Multiplayer</a>
    <a href="#">New</a>
  </nav>

  <div class="container">
    <div class="grid" id="gameGrid">
      <!-- Game cards will be injected here -->
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Moonsun Games. Play free games anytime, anywhere.</p>
  </footer>

  <script>
    const games = Array.from({ length: 30 }, (_, i) => ({
      title: `Game ${i + 1}`,
      image: `https://source.unsplash.com/400x300/?game,${i}`,
      link: `https://example.com/game${i + 1}` // Replace with real game URLs
    }));

    const gameGrid = document.getElementById("gameGrid");

    function renderGames(list) {
      gameGrid.innerHTML = "";
      list.forEach(game => {
        const card = document.createElement("a");
        card.className = "game-card";
        card.href = game.link;
        card.target = "_blank";
        card.innerHTML = `
          <img src="${game.image}" alt="${game.title}" />
          <h3>${game.title}</h3>
        `;
        gameGrid.appendChild(card);
      });
    }

    renderGames(games);

    document.getElementById("searchInput").addEventListener("input", function(e) {
      const keyword = e.target.value.toLowerCase();
      const filtered = games.filter(game => game.title.toLowerCase().includes(keyword));
      renderGames(filtered);
    });
  </script>

</body>
</html>
